# Dependabot watches the one surface that actually ships: the 8 runtime deps
# in package.json are bundled into dist/extension.js, so an advisory in
# undici / pdfjs-dist / markdown-it / ws reaches every install. It also keeps
# the action SHAs pinned in release.yml fresh - those pins carry a
# version-in-comment and rot silently otherwise.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Dev-only tooling bumps together: esbuild / vite / playwright move often
      # and none of it ships inside the vsix.
      dev-dependencies:
        dependency-type: development
      # Production patches are mechanical and group together. Minors stay
      # individual on purpose: a bundled minor can change behaviour, and that
      # deserves a real look rather than riding along with unrelated bumps.
      production-patches:
        dependency-type: production
        update-types:
          - patch
    # Majors never auto-flow. Each ignore below is a real constraint, not
    # tidiness:
    #   - pdfjs-dist 5+ hard-requires DOMMatrix at module load, which does not
    #     exist in the extension host (see src/pdfExtract.ts).
    #   - eslint 10 and typescript 7 have no compatible tooling release yet
    #     (eslint-plugin-react peers <=9.7; typescript-eslint peers <6.1), so a
    #     grouped bump fails `npm ci` with ERESOLVE.
    #   - react / vite majors move the whole webview build and deserve their
    #     own verified PR.
    # Delete a line to opt back in - deliberately, in a PR.
    ignore:
      - dependency-name: pdfjs-dist
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react-dom"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday