name: Release

on:
  push:
    tags: ['v*']

# Two tags can never be released at once, and cancelling a half-finished
# release (a tag deleted mid-run, say) is worse than waiting.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default for the build job: read the repo, upload artifacts. The publish job
# below opts into `contents: write` for itself alone.
permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    outputs:
      # Handed to the publish job so the tag is validated ONCE, here, instead
      # of being re-parsed from `github.ref_name` in a second shell.
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      # Pin actions to full-length commit SHAs (version in comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Tag names matching the v* trigger may contain shell metacharacters;
      # only strict semver tags reach the shell below.
      - name: Validate tag
        id: tag
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          node .github/scripts/validate-release-tag.cjs "$RELEASE_TAG" "$commit" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Gate the release on the same host and webview checks as CI.
      - name: Type-check host (tsc --noEmit)
        run: node_modules/.bin/tsc --noEmit -p tsconfig.json

      - name: Type-check webview (tsc --noEmit)
        run: npx tsc --noEmit -p webview-ui/tsconfig.json

      - name: Type-check webview tests (tsc --noEmit)
        run: npx tsc --noEmit -p webview-ui/tsconfig.test.json

      - name: Webview tests
        run: npm run test:webview

      - name: Build host bundle
        run: node esbuild.js

      - name: Host tests
        run: npm run test:host

      - name: Package VSIX
        run: npx vsce package --no-dependencies -o "xratu-${RELEASE_TAG}.vsix"
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xratu-${{ steps.tag.outputs.tag }}-vsix
          path: xratu-*.vsix
          if-no-files-found: error

  # Publishing is the one step that needs a token, so it is its own job with
  # job-level `contents: write`. The build above stays read-only, so a
  # compromised `npm ci` script cannot reach the release API - it can only
  # write into this run's own artifact store.
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Release notes come from the exact commit used to build the VSIX.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.package.outputs.commit }}

      # Same run, so this needs no cross-run artifact permission.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xratu-${{ needs.package.outputs.tag }}-vsix
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.package.outputs.commit }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$RELEASE_TAG"
          refs=$(git ls-remote --exit-code origin "$tag_ref" "${tag_ref}^{}")
          direct=''
          peeled=''
          while IFS=$'\t' read -r object ref; do
            case "$ref" in
              "$tag_ref") direct="$object" ;;
              "${tag_ref}^{}") peeled="$object" ;;
            esac
          done <<< "$refs"
          if [ "${peeled:-$direct}" != "$RELEASE_COMMIT" ]; then
            echo "Tag $RELEASE_TAG no longer resolves to release commit $RELEASE_COMMIT"
            exit 1
          fi
          vsix=$(ls dist/xratu-*.vsix)
          notes=".github/release-notes/${RELEASE_TAG}.md"

          # A re-run of this workflow must not fail on an existing release.
          # `gh release create` errors if the tag is already published, so the
          # retry path replaces the asset instead.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG exists - replacing its asset only"
            gh release upload "$RELEASE_TAG" "$vsix" --clobber
            exit 0
          fi

          # Hand-written notes win: this repo's releases carry real prose, and
          # `--generate-notes` would replace that with a commit list. The file
          # is optional so a tag cut without one still publishes.
          if [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" "$vsix" \
              --title "xratu ${RELEASE_TAG#v}" \
              --notes-file "$notes" \
              --verify-tag
          else
            gh release create "$RELEASE_TAG" "$vsix" \
              --title "xratu ${RELEASE_TAG#v}" \
              --generate-notes \
              --verify-tag
          fi
