name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded PR runs are pure waste - the matrix is three OS legs. NEVER
# cancel on main: a killed main run tells you nothing about the commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI only checks out the repo and runs node. `contents: read` matches
# release.yml and drops the default token to read-only.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Default fail-fast cancels the sibling legs the moment one fails, which
      # HIDES whether they passed - a windows leg killed mid-`webServer` reports
      # exit 0xC000013A and looks like its own bug. Every leg is signal.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check host (tsc --noEmit)
        run: node_modules/.bin/tsc --noEmit -p tsconfig.json

      # SEPARATE project - host tsc does NOT cover webview-ui. Skipping this
      # step is exactly how CI-only type failures happen.
      - name: Type-check webview (tsc --noEmit)
        run: npx tsc --noEmit -p webview-ui/tsconfig.json

      - name: Build host bundle (esbuild)
        run: node esbuild.js

      - name: Webview tests
        run: npm run test:webview

      # Browser E2E for the webview bundle. Linux runners need the system
      # libraries (sudo is available); Windows and macOS runners ship them
      # already, so `--with-deps` is Linux-only here.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'

      - name: Install Playwright Chromium (Windows)
        run: npx playwright install chromium
        if: runner.os == 'Windows'

      - name: Install Playwright Chromium (macOS)
        run: npx playwright install chromium
        if: runner.os == 'macOS'

      - name: Webview E2E (Playwright)
        run: npm run test:e2e

      # A failed Playwright run writes `test-results/*/error-context.md` - a
      # page snapshot per failure. Without this they are thrown away, and the
      # next platform-specific failure is only diagnosable from the assertion
      # diff in the log. Uploads on failure only; `!cancelled()` so a
      # fail-fast sibling kill does not upload a misleading empty report.
      - name: Upload Playwright failure artifacts
        if: failure() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # Host-side suites (pure-node logic + security heuristics). Compile the
      # host first - the suites resolve `../out/*.js` (endpoint-guard needs
      # out/endpointGuard.js, etc.).
      - name: Compile host for node test suites
        run: npx tsc -p . --outDir out

      # ONE step, auto-discovering every `test:*` npm script (see
      # test/run-host-tests.mjs). The hand-maintained step list this replaces
      # had already drifted: test:model-metadata was never wired in at all,
      # so 90 assertions only ran on machines where someone typed it.
      - name: Host-side test suites
        run: npm run test:host
