name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded PR runs are pure waste - the matrix is three OS legs. NEVER
# cancel on main: a killed main run tells you nothing about the commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI only checks out the repo and runs node. `contents: read` matches
# release.yml and drops the default token to read-only.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # CI never commits, so installing the local git hooks is pointless - and if
    # husky ever failed during `npm ci`'s `prepare` step it would take the
    # whole build down before any real check ran. HUSKY=0 makes that step a
    # documented no-op here (husky honours it) while still working for humans.
    env:
      HUSKY: '0'
    strategy:
      # Default fail-fast cancels the sibling legs the moment one fails, which
      # HIDES whether they passed - a windows leg killed mid-`webServer` reports
      # exit 0xC000013A and looks like its own bug. Every leg is signal.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Static analysis (ESLint + TypeScript across host, webview, and webview
      # tests) is OS-independent: run once on Linux to save Windows/macOS time
      # while keeping the exact `build (<os>)` required status check names.
      - name: Lint (eslint)
        if: runner.os == 'Linux'
        run: npm run lint

      - name: Type-check host (tsc --noEmit)
        if: runner.os == 'Linux'
        run: node_modules/.bin/tsc --noEmit -p tsconfig.json

      # SEPARATE project - host tsc does NOT cover webview-ui. Skipping this
      # step is exactly how CI-only type failures happen.
      - name: Type-check webview (tsc --noEmit)
        if: runner.os == 'Linux'
        run: npx tsc --noEmit -p webview-ui/tsconfig.json

      - name: Type-check webview tests (tsc --noEmit)
        if: runner.os == 'Linux'
        run: npx tsc --noEmit -p webview-ui/tsconfig.test.json

      - name: Build host bundle (esbuild)
        run: node esbuild.js

      - name: Webview tests
        run: npm run test:webview

      # Host-side suites (pure-node logic, Windows/macOS/Linux process trees,
      # path/SSRF guards, shadow git, VSIX contents). `test:host` compiles
      # `out/` itself once and auto-discovers every `test:*` script.
      - name: Host-side test suites
        run: npm run test:host

      # Browser E2E drives the standalone webview bundle with a mocked
      # `acquireVsCodeApi` (no OS or extension-host code), plus Chromium
      # visual snapshots pinned to Linux. Running it once on Linux with a
      # cached Chromium binary removes ~45 minutes of duplicate macOS/Windows
      # browser runtime per PR without dropping cross-OS host coverage.
      - name: Resolve Playwright version
        id: playwright-version
        if: runner.os == 'Linux'
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: runner.os == 'Linux' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browser)
        if: runner.os == 'Linux' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Webview E2E (Playwright)
        if: runner.os == 'Linux'
        env:
          XRATU_VISUAL: '1'
        run: npm run test:e2e

      # Upload Playwright traces/screenshots only when E2E fails.
      - name: Upload Playwright results
        if: ${{ failure() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
