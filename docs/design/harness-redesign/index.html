}
function updateDock(){
  const root=document.querySelector('.dock-workspace');if(!root)return;
  ensureDock();syncPanelActivity();const narrow=dockNarrow(),d=state.dock,available=availablePanels();
  if(!available.has(d.mainActive))d.mainActive='conversation';
  if(!narrow&&!d.main.includes(d.mainActive))d.mainActive='conversation';
  if(!d.side.includes(d.sideActive)||!available.has(d.sideActive))d.sideActive=d.side.find(id=>available.has(id))||null;
  root.dataset.hasSide=String(d.side.some(id=>available.has(id)));
  root.querySelector('.dock-empty').hidden=narrow||!state.detailsOpen||!!d.sideActive;
  root.dataset.sideOpen=String(state.detailsOpen&&!narrow);
  root.dataset.views=String(state.viewsOpen);
  root.dataset.narrow=String(narrow);
  root.style.setProperty('--dock-width',`${Math.max(260,Math.min(state.sideWidth,600,root.clientWidth-360))}px`);
  root.querySelector('[data-tabbar-host=main]').innerHTML=dockTabBar('main');
  root.querySelector('[data-tabbar-host=side]').innerHTML=dockTabBar('side');
  root.querySelector('.dock-mini').innerHTML=d.side.filter(id=>available.has(id)).map(id=>`<button class="icon" data-dock-go="${id}" title="${label(id)}" aria-label="${label(id)}">${I(pageList().find(p=>p[0]===id)[2])}</button>`).join('');
  root.querySelectorAll('.dock-panel').forEach(panel=>{
    const id=panel.dataset.panel,location=narrow?'main':d.side.includes(id)?'side':'main';
    panel.dataset.location=location;panel.style.gridColumn=location==='side'?'2':'1';
    panel.hidden=!available.has(id)|| (location==='main'?id!==d.mainActive:!state.detailsOpen||id!==d.sideActive);
  });
  root.querySelector('.dock-resize').setAttribute('aria-valuenow',state.sideWidth);
  const draft=root.querySelector('#draft');if(draft&&document.activeElement!==draft&&draft.value!==state.draft)draft.value=state.draft;
  document.querySelectorAll('[data-action=nav]').forEach(button=>{button.setAttribute('aria-expanded',state.nav);button.title=button.ariaLabel=state.nav?L('Collapse sidebar','بستن نوار کناری'):L('Expand sidebar','باز کردن نوار کناری');});
  document.querySelectorAll('[data-action=views]').forEach(button=>{button.setAttribute('aria-expanded',state.viewsOpen);button.title=button.ariaLabel=state.viewsOpen?L('Hide work tabs','بستن تب های کار'):L('Show work tabs','نمایش تب های کار');});
  document.querySelectorAll('[data-action=details]').forEach(button=>{if(button.closest('.dock-workspace'))return;button.setAttribute('aria-pressed',state.detailsOpen);button.title=button.ariaLabel=state.detailsOpen?L('Hide side panel','بستن پنل کناری'):L('Show side panel','نمایش پنل کناری');});
}
function activateDock(id){
  ensureDock();if(!workRoutes.includes(id))return;
  if(id!=='conversation'&&!state.addedPanels.includes(id))state.addedPanels.push(id);
  if(dockNarrow()||state.dock.main.includes(id))state.dock.mainActive=id;
  else{state.dock.sideActive=id;state.detailsOpen=true;}
  if(id!=='conversation'){state.viewsOpen=true;state.tabsExplicitlyHidden=false;}
  state.page=id;state.lastWorkPage=id;
}
function moveDockPanel(id,to,before){
  ensureDock();if(!workRoutes.includes(id)||!['main','side'].includes(to)||(id==='conversation'&&to==='side')||id===before)return;
  const d=state.dock;d.main=d.main.filter(p=>p!==id);d.side=d.side.filter(p=>p!==id);
  const index=d[to].indexOf(before);d[to].splice(index<0?d[to].length:index,0,id);
  if(!d.main.includes(d.mainActive))d.mainActive='conversation';
  if(to==='main')d.mainActive=id;else{d.sideActive=id;state.detailsOpen=true;}
  if(!state.addedPanels.includes(id))state.addedPanels.push(id);
  state.viewsOpen=true;state.tabsExplicitlyHidden=false;state.page=id;updateDock();renderLab();
}

document.addEventListener('click',event=>{const el=event.target.closest('button');if(!el)return;if(el.dataset.go)return go(el.dataset.go);if(el.dataset.file){state.notes[state.file]=state.feedback;state.file=el.dataset.file;state.feedback=state.notes[state.file]||'';if(document.querySelector('.dock-workspace'))return refreshDockPanel('review');return render()}if(el.dataset.toggle){const current=el.getAttribute('aria-checked')==='true';state.toggles[el.dataset.toggle]=!current;el.setAttribute('aria-checked',!current);return}if(el.dataset.action)act(el.dataset.action,el)});
document.addEventListener('input',event=>{if(event.target.id==='draft'){state.draft=event.target.value;updateComposerControls();}if(event.target.hasAttribute('data-feedback'))state.feedback=event.target.value;if(event.target.hasAttribute('data-search')){state.filter=event.target.value;filter()}});
document.addEventListener('change',event=>{const name=event.target.dataset.change;if(!name)return;let value=event.target.value;if(name==='page')return go(value);if(name==='concept'){state.light=value==='canvas';state.dock=null;}if(name==='status'){state.status=value;state.page='conversation'}else state[name]=value;render()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){state.modal=null;state.nav=false;render()}if(state.modal&&event.key==='Tab'){const nodes=[...document.querySelectorAll('.modal button,.modal input,.modal select,.modal textarea')].filter(n=>!n.disabled&&!n.hidden);const first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}}if((event.ctrlKey||event.metaKey)&&event.key==='k'){event.preventDefault();act('command')}if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)&&event.target.id==='draft'){event.preventDefault();act('send')}});


document.addEventListener('click',event=>{
  const tab=event.target.closest('[data-dock-go]');if(tab){const id=tab.dataset.dockGo;go(id);document.getElementById('work-tab-'+id)?.focus({preventScroll:true});return;}
  const move=event.target.closest('[data-move-panel]');if(move)moveDockPanel(move.dataset.movePanel,move.dataset.moveTo);
});
document.addEventListener('keydown',event=>{
  const tab=event.target.closest('[role=tab]');if(!tab)return;
  if(event.ctrlKey&&event.shiftKey&&['ArrowLeft','ArrowRight'].includes(event.key)){
    event.preventDefault();const to=event.key===(state.locale==='fa'?'ArrowLeft':'ArrowRight')?'side':'main';moveDockPanel(tab.dataset.panelTab,to);document.getElementById('work-tab-'+tab.dataset.panelTab)?.focus();return;
  }
  if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
  event.preventDefault();const list=[...tab.closest('[role=tablist]').querySelectorAll('[role=tab]')],index=list.indexOf(tab),forward=state.locale==='fa'?'ArrowLeft':'ArrowRight';
  const next=event.key==='Home'?0:event.key==='End'?list.length-1:(index+(event.key===forward?1:-1)+list.length)%list.length;
  const id=list[next].dataset.dockGo;go(id);document.getElementById('work-tab-'+id)?.focus();
});
document.addEventListener('dragstart',event=>{const tab=event.target.closest('[data-panel-tab]');if(!tab||tab.dataset.panelTab==='conversation')return;state.dragPanel=tab.dataset.panelTab;event.dataTransfer.setData('application/x-xratu-panel',state.dragPanel);event.dataTransfer.effectAllowed='move';document.querySelector('.dock-workspace')?.classList.add('dragging');});
document.addEventListener('dragover',event=>{const zone=event.target.closest('[data-drop-zone]');if(zone&&state.dragPanel){event.preventDefault();event.dataTransfer.dropEffect='move';zone.classList.add('drag-target');}});
document.addEventListener('dragleave',event=>{const zone=event.target.closest('[data-drop-zone]');if(zone&&!zone.contains(event.relatedTarget))zone.classList.remove('drag-target');});
document.addEventListener('drop',event=>{const zone=event.target.closest('[data-drop-zone]');if(!zone||!state.dragPanel)return;event.preventDefault();const id=event.dataTransfer.getData('application/x-xratu-panel');if(id===state.dragPanel)moveDockPanel(id,zone.dataset.dropZone,event.target.closest('[data-panel-tab]')?.dataset.panelTab);state.dragPanel=null;document.querySelector('.dock-workspace')?.classList.remove('dragging');document.querySelectorAll('.drag-target').forEach(node=>node.classList.remove('drag-target'));});
document.addEventListener('dragend',()=>{state.dragPanel=null;document.querySelector('.dock-workspace')?.classList.remove('dragging');document.querySelectorAll('.drag-target').forEach(node=>node.classList.remove('drag-target'));});
document.addEventListener('submit',event=>{if(!event.target.matches('[data-browser-form]'))return;event.preventDefault();const field=event.target.querySelector('input');try{const url=new URL(field.value);if(!['http:','https:'].includes(url.protocol))throw new Error();state.browserUrl=url.href;toast(L('Prototype preview stays local.','پیش نمایش نمونه محلی میمونه.'));}catch{toast(L('Enter an HTTP or HTTPS URL.','یه آدرس HTTP یا HTTPS وارد کن.'));}});
document.addEventListener('change',event=>{if(event.target.matches('[data-browser-viewport]'))event.target.closest('.browser-panel').querySelector('.browser-canvas').dataset.viewport=event.target.value;});
let resizeState=null;
document.addEventListener('pointerdown',event=>{if(!event.target.matches('.dock-resize'))return;event.preventDefault();resizeState={x:event.clientX,width:state.sideWidth,sign:state.locale==='fa'?1:-1};event.target.setPointerCapture(event.pointerId);});
document.addEventListener('pointermove',event=>{if(!resizeState)return;state.sideWidth=Math.max(260,Math.min(600,resizeState.width+(event.clientX-resizeState.x)*resizeState.sign));updateDock();});
document.addEventListener('pointerup',()=>{resizeState=null;});
document.addEventListener('keydown',event=>{if(!event.target.matches('.dock-resize')||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const sign=state.locale==='fa'?1:-1;state.sideWidth=event.key==='Home'?260:event.key==='End'?600:Math.max(260,Math.min(600,state.sideWidth+(event.key==='ArrowLeft'?-20:20)*sign));updateDock();});
window.addEventListener('resize',()=>updateDock());
document.addEventListener('click',event=>{
  const composer=event.target.closest('.composer');
  if(composer&&!event.target.closest('button,input,select,textarea,.composer-popup'))composer.querySelector('textarea')?.focus();
});
document.addEventListener('toggle',event=>{if(event.target.matches?.('.completed-steps'))state.completedOpen=event.target.open;},true);
window.prototypeState=state;window.prototypeGo=go;render();
</script></body></html>
