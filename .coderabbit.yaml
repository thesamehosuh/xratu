# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Temporary per-PR filter to stay under CodeRabbit's 100-file review limit.
# Remove this file before merging.
reviews:
  profile: assertive
  path_filters:
    - "!.coderabbit.yaml"
    - "!test/**"
    - "!webview-ui/test/**"
    - "!docs/**"
